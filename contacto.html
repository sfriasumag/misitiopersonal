<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <nav>
        <ul>
            <Li> <a href="index.html" target="_blank"> Inicio </a> </Li>
            <Li> <a href="sobre-mi.html" target="_blank"> Sobre Mi </a> </Li>
            <Li> <a href="contacto.html" target="_blank"> Contacto </a> </Li>
        </ul>
    </nav>
    <h1>Contacto</h1>
    <h2>Rellena el siguiente formulario para que te contacte:</h2>
   <form> 
    <table border="1">
        <tr>
            <th><img src="https://www.svgrepo.com/show/529293/user.svg" width="14"><label for="name">Nombre</label></th>
        </tr>
        <tr>
            <td><input type="text" id="name" name="nombre" required></td>
        </tr>
        <tr>
            <th><img src="https://www.svgrepo.com/show/533226/mail-pencil.svg" width="14"><label for="email">Correo</label></th>
        </tr>
        <tr>
            <td><input type="email" id="email" name="correo" required></td>
        </tr>
        <tr>
            <th><img src="https://www.svgrepo.com/show/502605/date-range.svg" width="14"><label for="fecha">Fecha</label></th>
        </tr>
        <tr>
              <td><input type="date" id="fecha" name="fecha" required></td>
        </tr>
        <tr>
            <th><img src="https://www.svgrepo.com/show/487544/magnifier-glass.svg" width="14"><label for="asunto">Asunto</label></th>
        </tr>
        <tr>
            <td><select id="asunto" name="asunto">
                    <option>Consulta</option>
                    <option>Reclamo</option>
                    <option>Otros</option>
            </select></td>
        </tr>
        <tr>
            <th colspan="2" align="center"><img src="https://www.svgrepo.com/show/533270/message-square-lines-alt.svg" width="14"><label for="mensaje">Mensaje</label></th>
        </tr>
        <tr>
            <td colspan="2" align="center"><textarea name="mensaje" id="mensaje"></textarea></td>
        </tr>
         <tr>
              <td colspan="2" align="center"><button type="submit">Enviar</button></td>
         </tr>
    </table>
</form>
</body>
</html>
